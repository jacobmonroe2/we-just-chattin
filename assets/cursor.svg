<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="y" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd84a"/><stop offset="0.5" stop-color="#f7c600"/><stop offset="1" stop-color="#d9a500"/>
    </linearGradient>
  </defs>
  <!-- slotted turner, true proportions: wide rounded head, narrow neck, long handle; tip points up-left -->
  <g transform="translate(1,-3) rotate(-38 32 32)" stroke="#8a6200" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle -->
    <path d="M29.6 34 h4.8 l0.9 24 a3.3 3.3 0 0 1 -6.6 0 z" fill="url(#y)"/>
    <!-- head: wider at the top, rounded corners, tapering into the neck -->
    <path d="M20.5 7.5 q0 -2.5 2.5 -2.5 h18 q2.5 0 2.5 2.5 l-3.2 22 q-0.4 2.2 -2.6 2.6 l-3.1 0.4 h-5.2 l-3.1 -0.4 q-2.2 -0.4 -2.6 -2.6 z" fill="url(#y)"/>
    <!-- slots -->
    <g stroke="none" fill="#5a4000" opacity="0.92">
      <rect x="25.3" y="9" width="2.6" height="17" rx="1.3"/>
      <rect x="30.7" y="9" width="2.6" height="17" rx="1.3"/>
      <rect x="36.1" y="9" width="2.6" height="17" rx="1.3"/>
    </g>
    <!-- highlight -->
    <path d="M23.3 8.5 l-1.1 18" stroke="#fff3b8" stroke-width="1.6" opacity="0.8" fill="none"/>
  </g>
</svg>
